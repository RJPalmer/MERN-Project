name: Backend CI

on:
  pull_request:
    paths:
      - "server/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  backend:
    name: Backend syntax and formatting
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: find server/src server/scripts -type f -name '*.js' -print0 | xargs -0 -r -n 1 node --check

      - name: Check formatting
        run: npx --yes prettier@3.6.2 --check "server/src/**/*.js" "server/scripts/**/*.js"
